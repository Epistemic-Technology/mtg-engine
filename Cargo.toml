[workspace]
resolver = "3"
members = [
    "crates/mtg-core",
    "crates/mtg-dsl",
    "crates/mtg-cards",
    "crates/mtg-scenario",
    "crates/mtg-agents",
    "crates/mtg-sim",
    "crates/mtg-cli",
    "crates/mtg-py",
    "crates/mtg-mcp",
    "crates/mtg-review",
    "crates/mtg-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Epistemic-Technology/mtg-engine"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slotmap = { version = "1", features = ["serde"] }
smallvec = { version = "1", features = ["union", "const_generics", "serde"] }
rand = "0.9"
rand_chacha = "0.9"
regex = "1"
rayon = "1"
thiserror = "2"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
