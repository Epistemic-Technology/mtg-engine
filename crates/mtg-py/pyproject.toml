[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "mtg-engine"
version = "0.1.0"
description = "A Magic: The Gathering rules engine for AI play: engine bindings and a PettingZoo environment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "gymnasium>=1.0", "pettingzoo>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "mtg_engine._mtg_engine"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
