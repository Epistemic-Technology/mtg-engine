[package]
name = "mtg-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the MTG engine: a thin Engine class and the PettingZoo environment's encoders"

[lib]
name = "_mtg_engine"
crate-type = ["cdylib"]
# A cdylib built as an extension module links against no libpython; its
# tests live in python/tests and run under pytest.
test = false
doctest = false

[dependencies]
mtg-agents = { path = "../mtg-agents" }
mtg-core = { path = "../mtg-core" }
mtg-dsl = { path = "../mtg-dsl" }
mtg-sim = { path = "../mtg-sim" }
numpy.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
serde_json.workspace = true

[lints]
workspace = true
