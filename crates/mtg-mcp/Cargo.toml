[package]
name = "mtg-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server for the MTG engine: play games over stdio or streamable HTTP"

[[bin]]
name = "mtg-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mtg-agents = { path = "../mtg-agents" }
mtg-core = { path = "../mtg-core" }
mtg-dsl = { path = "../mtg-dsl" }
mtg-sim = { path = "../mtg-sim" }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client"] }
rand.workspace = true
rand_chacha.workspace = true

[lints]
workspace = true
